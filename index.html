<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหาข้อมูลตรวจเช็ค Separator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- jQuery (จำเป็นสำหรับ DataTables) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- DataTables CSS & JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- ไลบรารีสำหรับสร้าง PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.25rem 0.5rem;
            margin-bottom: 1rem;
            outline: none;
        }
        .dataTables_wrapper .dataTables_filter input:focus { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
        table.dataTable.no-footer { border-bottom: 1px solid #e5e7eb; }
        table.dataTable thead th, table.dataTable thead td { border-bottom: 2px solid #e5e7eb; background-color: #f9fafb; }
        table.dataTable tbody tr { background-color: #ffffff; }
        table.dataTable tbody tr:nth-child(even) { background-color: #f9fafb; }
        table.dataTable tbody tr:hover { background-color: #eff6ff; }
        
        .modal-active { overflow: hidden; }
        
        /* SweetAlert Loader Animation */
        .swal-loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* ================== CSS สำหรับ PDF ================== */
        @media print {
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            
            #modal-content {
                background-color: white !important;
                color: black !important;
                padding: 0 !important;
            }

            .pdf-container {
                width: 100%;
                margin: 0 auto;
            }

            .pdf-header {
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #333;
                padding-bottom: 10px;
            }

            .pdf-section-title {
                font-weight: bold;
                font-size: 14pt;
                margin-top: 15px;
                margin-bottom: 10px;
                background-color: #f0f0f0;
                padding: 5px;
                border-left: 5px solid #0056b3;
            }

            /* ใช้ Table ควบคุม Layout ภาพ ไม่ให้ถูกตัดกลาง */
            .pdf-image-table {
                width: 100%;
                page-break-inside: avoid; /* ห้ามตัดกลางตาราง */
                margin-bottom: 15px;
            }
            .pdf-image-table td {
                text-align: center;
                vertical-align: middle;
                padding: 10px;
                border: 1px solid #ddd;
            }
            
            .pdf-img {
                max-width: 100%;
                /* บังคับความสูงสูงสุดเพื่อไม่ให้รูปเดียวล้นหน้ากระดาษ */
                max-height: 400px; 
                object-fit: contain;
                display: block;
                margin: 0 auto;
            }

            /* สไตล์สำหรับตารางข้อมูล */
            .data-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 15px;
                page-break-inside: avoid;
            }
            .data-table th, .data-table td {
                border: 1px solid #aaa;
                padding: 8px;
                text-align: left;
            }
            .data-table th {
                background-color: #e6e6e6;
                width: 40%;
            }
        }
        
        /* สไตล์สำหรับดูบนหน้าจอปกติ (ซ่อนส่วนที่เป็น PDF เฉพาะ) */
        body:not(.exporting-pdf) .pdf-only { display: none; }
        
        /* สไตล์สำหรับตอน Export (ซ่อนปุ่มและ UI ไม่จำเป็น) */
        body.exporting-pdf .no-print { display: none !important; }
        body.exporting-pdf #detailModal {
            position: static !important;
            background: none !important;
        }
        body.exporting-pdf #detailModal > div {
            max-width: 100% !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md overflow-hidden no-print">
        
        <!-- Header -->
        <div class="bg-blue-800 p-6 flex flex-col md:flex-row justify-between items-center text-white">
            <div>
                <h1 class="text-2xl font-bold">ข้อมูลประวัติการตรวจเช็ค Separator</h1>
                <p class="text-blue-200 text-sm mt-1">ระบบดึงข้อมูลอัตโนมัติจาก Google Sheets</p>
            </div>
            <div class="mt-4 md:mt-0 flex space-x-3">
                <button onclick="fetchData()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md font-semibold transition shadow flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    รีเฟรชข้อมูล
                </button>
                <a href="form.html" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-md font-semibold transition shadow flex items-center">
                    + เพิ่มรายการใหม่
                </a>
            </div>
        </div>

        <!-- Table Container -->
        <div class="p-6 overflow-x-auto min-h-[400px]">
            <table id="dataTable" class="display responsive nowrap w-full text-sm hidden" style="width:100%">
                <thead>
                    <tr>
                        <th>วันที่ตรวจเช็ค</th>
                        <th>CM Number</th>
                        <th>ผู้ตรวจเช็ค</th>
                        <th>ท่อเข้า Cyclone</th>
                        <th>ผนังกัน Rotor</th>
                        <th>เวลาบันทึก (Timestamp)</th>
                        <th>รายละเอียด</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal สำหรับดูรายละเอียดแบบเต็ม -->
    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto transform transition-all">
            
            <div class="sticky top-0 bg-gray-800 text-white px-6 py-4 flex justify-between items-center rounded-t-xl z-10 no-print">
                <h2 class="text-xl font-bold" id="modal-title">รายละเอียดการตรวจเช็ค</h2>
                <button onclick="closeModal()" class="text-gray-300 hover:text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 bg-white" id="modal-content">
                <!-- Content injected via JS -->
            </div>
            
            <div class="bg-gray-50 px-6 py-4 rounded-b-xl flex justify-end space-x-3 no-print">
                <button onclick="downloadPDF()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded shadow transition flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    โหลดเป็น PDF
                </button>
                <button onclick="closeModal()" class="px-6 py-2 bg-gray-600 hover:bg-gray-700 text-white font-semibold rounded shadow transition">ปิดหน้าต่าง</button>
            </div>
        </div>
    </div>

    <!-- Javascript -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGKkCzyqUbBun5bW_v38W1_8thC49CbitoPvIITLb4YcNBN37QcW06499woUGH3Q/exec";
        let allData = [];
        let dataTable;

        function getStatusText(status) {
            const s = String(status||'').toLowerCase().trim();
            if(s === 'normal' || (s.includes('ปกติ') && !s.includes('ไม่'))) return 'ปกติ';
            return 'ไม่ปกติ';
        }

        function getStatusBadge(status) {
            const text = getStatusText(status);
            if(text === 'ปกติ') {
                return `<span class="px-3 py-1 inline-flex text-sm leading-5 font-bold rounded-md bg-green-100 text-green-800 border border-green-200 shadow-sm no-print">ปกติ</span><span class="pdf-only text-green-700 font-bold">ปกติ</span>`;
            } else {
                return `<span class="px-3 py-1 inline-flex text-sm leading-5 font-bold rounded-md bg-red-100 text-red-800 border border-red-200 shadow-sm no-print">ไม่ปกติ</span><span class="pdf-only text-red-700 font-bold">ไม่ปกติ</span>`;
            }
        }

        function getDirectDriveLink(url) {
            if (!url) return '';
            const match = url.match(/\/d\/(.*?)\//);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        async function fetchData() {
            Swal.fire({
                title: 'กำลังดึงข้อมูล...',
                html: 'รอสักครู่ ระบบกำลังเชื่อมต่อฐานข้อมูล<br><br><div class="swal-loader"></div>',
                showConfirmButton: false,
                allowOutsideClick: false,
                allowEscapeKey: false
            });
            
            document.getElementById('dataTable').classList.add('hidden');
            if ($.fn.DataTable.isDataTable('#dataTable')) {
                $('#dataTable').DataTable().destroy();
            }
            document.getElementById('tableBody').innerHTML = '';

            try {
                const response = await fetch(SCRIPT_URL);
                const json = await response.json();

                if (json.result === 'success') {
                    allData = json.data;
                    renderTable(allData);
                    Swal.close();
                } else {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + json.message, 'error');
                }
            } catch (error) {
                Swal.fire('เชื่อมต่อล้มเหลว', 'กรุณาตรวจสอบอินเทอร์เน็ต: ' + error.message, 'error');
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                const date = row["วันที่ตรวจเช็ค"] ? row["วันที่ตรวจเช็ค"].split(' ')[0] : '-'; 
                const cm = row["CM_Number"] || '-';
                const checker = row["ชื่อผู้ตรวจเช็ค"] || '-';
                
                const getMiniBadge = (status) => {
                    const text = getStatusText(status);
                    if(text === 'ปกติ') return `<span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">ปกติ</span>`;
                    return `<span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">ไม่ปกติ</span>`;
                };

                tr.innerHTML = `
                    <td class="font-medium text-gray-900">${date}</td>
                    <td class="font-bold text-blue-600">${cm}</td>
                    <td>${checker}</td>
                    <td>${getMiniBadge(row["ท่อเข้า_Cyclone"])}</td>
                    <td>${getMiniBadge(row["ผนังกันRotor"])}</td>
                    <td class="text-gray-500 text-xs">${row["Timestamp"] || '-'}</td>
                    <td>
                        <button onclick="viewDetails(${index})" class="text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold py-1 px-3 border border-indigo-200 rounded shadow-sm transition flex items-center">
                            ดูข้อมูลทั้งหมด
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('dataTable').classList.remove('hidden');
            $('#dataTable').DataTable({
                responsive: true,
                language: { search: "ค้นหาข้อมูล:", lengthMenu: "แสดง _MENU_ รายการ", info: "กำลังแสดง _START_ ถึง _END_ จากทั้งหมด _TOTAL_", infoEmpty: "ไม่พบข้อมูล", zeroRecords: "ไม่พบข้อมูล", paginate: { first: "หน้าแรก", last: "หน้าสุดท้าย", next: "ถัดไป", previous: "ก่อนหน้า" } },
                order: [[5, 'desc']] 
            });
        }

        function viewDetails(index) {
            const row = allData[index];
            if(!row) return;

            const dateStr = row["วันที่ตรวจเช็ค"] ? row["วันที่ตรวจเช็ค"].split(' ')[0] : '-';
            const cmStr = row["CM_Number"] || '-';

            // โครงสร้าง HTML แบบตาราง เพื่อให้การแบ่งหน้า PDF ทำได้เสถียรที่สุด
            const html = `
                <div class="pdf-container">
                    
                    <div class="pdf-header text-center mb-6 border-b-2 border-gray-800 pb-4">
                        <h1 class="text-2xl font-bold uppercase mb-2">รายงานผลการตรวจเช็ค Separator ${cmStr}</h1>
                        <p class="text-gray-700">วันที่ตรวจเช็ค: ${dateStr} | ผู้ตรวจเช็ค: ${row["ชื่อผู้ตรวจเช็ค"] || '-'}</p>
                    </div>

                    <!-- ================== ส่วนที่ 1 ================== -->
                    <div class="pdf-section-title">1. ข้อมูลรูปภาพอ้างอิง และ ระยะช่องใบ</div>
                    
                    <table class="pdf-image-table avoid-break">
                        <tr>
                            <td>
                                <img src="https://lh3.googleusercontent.com/d/1fB0YiYEVY87YhMGVOJegLrTP7JBcOjmN" class="pdf-img" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>

                    <table class="data-table">
                        <tr><th>ระยะช่องใบ 1,2 (Std: 55 mm)</th><td>${row["Gap_ใบที่1-2(55mm)"] || '-'} mm</td></tr>
                        <tr><th>ระยะช่องใบ 3,4 (Std: 66 mm)</th><td>${row["Gap_ใบที่3-4(66mm)"] || '-'} mm</td></tr>
                        <tr><th>ระยะช่องใบ 5,6 (Std: 77 mm)</th><td>${row["Gap_ใบที่5-6(77mm)"] || '-'} mm</td></tr>
                        <tr><th>ระยะช่องใบ 7,8 (Std: 88 mm)</th><td>${row["Gap_ใบที่7-8(88mm)"] || '-'} mm</td></tr>
                        <tr><th>ระยะช่องใบ 9,10 (Std: 99 mm)</th><td>${row["Gap_ใบที่9-10(99mm)"] || '-'} mm</td></tr>
                        <tr><th>ระยะช่องใบ 11,12 (Std: 110 mm)</th><td>${row["Gap_ใบที่11-12(110mm)"] || '-'} mm</td></tr>
                    </table>

                    <!-- ================== ส่วนที่ 2 ================== -->
                    <div class="page-break"></div>
                    <div class="pdf-section-title">2. สถานะช่องใบ (Guide Vane)</div>
                    
                    <table class="pdf-image-table avoid-break">
                        <tr>
                            <td>
                                <img src="https://lh3.googleusercontent.com/d/1nIvh8xEG7UpZeUT65NIwntaYqYbxYR8w" class="pdf-img" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>

                    <table class="data-table">
                        <tr><th>ช่องใบที่ 1,2</th><td>${getStatusText(row["GuideVane_1-2"])} ${row["GuideVane_1-2_Remark"] ? `(Remark: ${row["GuideVane_1-2_Remark"]})` : ''}</td></tr>
                        <tr><th>ช่องใบที่ 3,4</th><td>${getStatusText(row["GuideVane_3-4"])} ${row["GuideVane_3-4_Remark"] ? `(Remark: ${row["GuideVane_3-4_Remark"]})` : ''}</td></tr>
                        <tr><th>ช่องใบที่ 5,6</th><td>${getStatusText(row["GuideVane_5-6"])} ${row["GuideVane_5-6_Remark"] ? `(Remark: ${row["GuideVane_5-6_Remark"]})` : ''}</td></tr>
                        <tr><th>ช่องใบที่ 7,8</th><td>${getStatusText(row["GuideVane_7-8"])} ${row["GuideVane_7-8_Remark"] ? `(Remark: ${row["GuideVane_7-8_Remark"]})` : ''}</td></tr>
                        <tr><th>ช่องใบที่ 9,10</th><td>${getStatusText(row["GuideVane_9-10"])} ${row["GuideVane_9-10_Remark"] ? `(Remark: ${row["GuideVane_9-10_Remark"]})` : ''}</td></tr>
                        <tr><th>ช่องใบที่ 11,12</th><td>${getStatusText(row["GuideVane_11-12"])} ${row["GuideVane_11-12_Remark"] ? `(Remark: ${row["GuideVane_11-12_Remark"]})` : ''}</td></tr>
                    </table>

                    <!-- ================== ส่วนที่ 3 ================== -->
                    <div class="page-break"></div>
                    <div class="pdf-section-title">3. ตรวจสอบ Cyclone & Chute</div>
                    
                    <table class="data-table avoid-break">
                        <tr><th>3.1 สภาพท่อเข้า Cyclone</th><td>${getStatusText(row["ท่อเข้า_Cyclone"])} ${row["ท่อเข้า_Cyclone_Remark"] ? `(Remark: ${row["ท่อเข้า_Cyclone_Remark"]})` : ''}</td></tr>
                        <tr>
                            <td colspan="2" style="text-align:center; padding: 10px;">
                                <img src="https://lh3.googleusercontent.com/d/1nMrtF1OJ5tXz-puE5h7ZuUL6OZAHxpO_" style="max-height: 200px; margin: 0 auto; display:block;" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>

                    <table class="data-table avoid-break">
                        <tr><th>3.2 สภาพแผ่นกระจายลม</th><td>${getStatusText(row["แผ่นกระจายลม"])} ${row["แผ่นกระจายลม_Remark"] ? `(Remark: ${row["แผ่นกระจายลม_Remark"]})` : ''}</td></tr>
                        <tr>
                            <td colspan="2" style="text-align:center; padding: 10px;">
                                <img src="https://lh3.googleusercontent.com/d/1J77Bi5WyN1jVCqToMOx6wxK1rbYx6US5" style="max-height: 200px; margin: 0 auto; display:block;" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>
                    
                    <table class="data-table avoid-break">
                        <tr><th>3.3 การกองวัตถุดิบรอบ Guide vane</th><td>${getStatusText(row["กองวัตถุดิบ"])} ${row["กองวัตถุดิบ_Remark"] ? `(Remark: ${row["กองวัตถุดิบ_Remark"]})` : ''}</td></tr>
                        <tr>
                            <td colspan="2" style="text-align:center; padding: 10px;">
                                <img src="https://lh3.googleusercontent.com/d/1myQFA5E8NkqFZTsz1W2VsrTk34MJolaV" style="max-height: 200px; margin: 0 auto; display:block;" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>

                    <table class="data-table avoid-break">
                        <tr><th>3.4 ระยะ Chute ลง Rotor (cm) <br><span style="font-weight:normal;">(Std Gap: 15 cm)</span></th>
                            <td>
                                ใต้/ออก: ${row["ChuteลงRotor_ใต้/ออก"]||'-'} | 
                                ใต้/ตก: ${row["ChuteลงRotor_ใต้/ตก"]||'-'} | 
                                เหนือ/ออก: ${row["ChuteลงRotor_เหนือ/ออก"]||'-'}
                                ${row["ChuteลงRotor_Remark"] ? `<br>Remark: ${row["ChuteลงRotor_Remark"]}` : ''}
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" style="text-align:center; padding: 10px;">
                                <img src="https://lh3.googleusercontent.com/d/1kFtHlbPvrQD_z5fECORuxeSDBg7Rnhow" style="max-height: 200px; margin: 0 auto; display:block;" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>

                     <table class="data-table avoid-break">
                        <tr><th>3.5 Chute รับจากปูนเข้า Sep</th><td>${getStatusText(row["Chuteเข้าSep"])} ${row["Chuteเข้าSep_Remark"] ? `(Remark: ${row["Chuteเข้าSep_Remark"]})` : ''}</td></tr>
                        <tr>
                            <td colspan="2" style="text-align:center; padding: 10px;">
                                <img src="https://lh3.googleusercontent.com/d/1UiLaihD4CIgfx3-vwtLzPIiN0KurPgM3" style="max-height: 200px; margin: 0 auto; display:block;" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>

                    <!-- ================== ส่วนที่ 4 ================== -->
                    <div class="page-break"></div>
                    <div class="pdf-section-title">4. ตรวจสอบขั้นสุดท้าย & รูปภาพแนบ</div>
                    
                    <table class="data-table avoid-break">
                        <tr>
                            <th>4.1 ระยะ Gap Air Seal<br><span style="font-weight:normal;">(Std: 5 mm)</span></th>
                            <td>
                                จุด 1: ${row["AirSeal_จุด1"]||'-'} | จุด 2: ${row["AirSeal_จุด2"]||'-'} | จุด 3: ${row["AirSeal_จุด3"]||'-'} | จุด 4: ${row["AirSeal_จุด4"]||'-'}<br>
                                จุด 5: ${row["AirSeal_จุด5"]||'-'} | จุด 6: ${row["AirSeal_จุด6"]||'-'} | จุด 7: ${row["AirSeal_จุด7"]||'-'} | จุด 8: ${row["AirSeal_จุด8"]||'-'}
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" style="text-align:center; padding: 10px;">
                                <img src="https://lh3.googleusercontent.com/d/1j28LAZEmg7N1hchQkqyAt60B7LylQDNN" style="max-height: 200px; margin: 0 auto; display:block;" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>

                    <table class="data-table avoid-break">
                        <tr><th>4.2 สภาพผนังกันข้าง Rotor<br><span style="font-weight:normal;">(ต้องไม่รั่ว)</span></th><td>${getStatusText(row["ผนังกันRotor"])} ${row["ผนังกันRotor_Remark"] ? `(Remark: ${row["ผนังกันRotor_Remark"]})` : ''}</td></tr>
                        <tr>
                            <td colspan="2" style="text-align:center; padding: 10px;">
                                <img src="https://lh3.googleusercontent.com/d/1I9FR-D4U1smyxD5wXtqpHcxFcZUtjWQJ" style="max-height: 200px; margin: 0 auto; display:block;" crossorigin="anonymous">
                            </td>
                        </tr>
                    </table>

                    <div class="pdf-section-title">หมายเหตุเพิ่มเติม / รูปภาพที่แนบมา</div>
                    <div style="border: 1px solid #aaa; padding: 10px; min-height: 50px; margin-bottom: 20px; white-space: pre-wrap;">${row["Remark_อื่นๆ"] || 'ไม่มีหมายเหตุเพิ่มเติม'}</div>

                    ${row["รูปแนบ_1"] ? `
                        <table class="pdf-image-table avoid-break">
                            <tr><th>รูปแนบ 1</th></tr>
                            <tr>
                                <td>
                                    <img src="${getDirectDriveLink(row["รูปแนบ_1"])}" class="pdf-img" onclick="viewImageFull(this.src)" crossorigin="anonymous">
                                </td>
                            </tr>
                        </table>
                    ` : ''}
                    
                    ${row["รูปแนบ_2"] ? `
                        <table class="pdf-image-table avoid-break">
                            <tr><th>รูปแนบ 2</th></tr>
                            <tr>
                                <td>
                                    <img src="${getDirectDriveLink(row["รูปแนบ_2"])}" class="pdf-img" onclick="viewImageFull(this.src)" crossorigin="anonymous">
                                </td>
                            </tr>
                        </table>
                    ` : ''}
                    
                </div>
            `;

            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('detailModal').classList.remove('hidden');
            document.body.classList.add('modal-active');
        }

        function viewImageFull(src) {
            // ไม่ให้เปิดรูปในโหมดพิมพ์ PDF
            if (document.body.classList.contains('exporting-pdf')) return;
            Swal.fire({
                imageUrl: src,
                imageAlt: 'ภาพแนบ',
                width: '90%',
                padding: '1em',
                showConfirmButton: false,
                showCloseButton: true,
                backdrop: `rgba(0,0,0,0.85)`
            });
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.body.classList.remove('modal-active');
        }

        $(document).ready(function() {
            fetchData();
        });
        
        function downloadPDF() {
            const element = document.getElementById('modal-content');
            
            // ใช้ชื่อ CM_Number ในการตั้งชื่อไฟล์
            const cmStr = allData.length > 0 ? (allData[0]["CM_Number"] || 'Unknown') : 'Unknown';
            const fileName = `Report_Separator_${cmStr}.pdf`;

            const opt = {
                margin:       0.5,
                filename:     fileName,
                image:        { type: 'jpeg', quality: 0.98 },
                pagebreak:    { mode: ['css', 'legacy'] },
                html2canvas:  { scale: 2, useCORS: true }, 
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            Swal.fire({
                title: 'กำลังเตรียมไฟล์ PDF',
                text: 'กรุณารอสักครู่ ระบบกำลังจัดหน้าเอกสาร...',
                didOpen: () => { Swal.showLoading() }
            });

            document.body.classList.add('exporting-pdf');

            html2pdf().set(opt).from(element).save().then(() => {
                document.body.classList.remove('exporting-pdf');
                Swal.close();
            }).catch((err) => {
                console.error(err);
                document.body.classList.remove('exporting-pdf');
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถสร้างไฟล์ PDF ได้', 'error');
            });
        }
    </script>
</body>
</html>
