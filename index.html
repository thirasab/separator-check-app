<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหาข้อมูลตรวจเช็ค Separator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- jQuery (จำเป็นสำหรับ DataTables) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- DataTables CSS & JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- ไลบรารีสำหรับสร้าง PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.25rem 0.5rem;
            margin-bottom: 1rem;
            outline: none;
        }
        .dataTables_wrapper .dataTables_filter input:focus { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
        table.dataTable.no-footer { border-bottom: 1px solid #e5e7eb; }
        table.dataTable thead th, table.dataTable thead td { border-bottom: 2px solid #e5e7eb; background-color: #f9fafb; }
        table.dataTable tbody tr { background-color: #ffffff; }
        table.dataTable tbody tr:nth-child(even) { background-color: #f9fafb; }
        table.dataTable tbody tr:hover { background-color: #eff6ff; }
        
        .modal-active { overflow: hidden; }
        
        /* SweetAlert Loader Animation */
        .swal-loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* ================== CSS ควบคุมการพิมพ์ PDF ================== */
        /* คำสั่งบังคับให้แต่ละหัวข้อขึ้นหน้าใหม่ใน PDF ทันที */
        .page-break {
            page-break-before: always !important;
            break-before: page !important;
            padding-top: 10px;
        }
        
        /* ป้องกันกล่องข้อมูลตัดขาดครึ่ง */
        .avoid-page-break {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        /* บังคับรูปภาพทั้งหมดให้กึ่งกลาง และไม่เกินหน้ากระดาษ */
        .pdf-img {
            max-width: 85% !important; /* บังคับความกว้างให้มีขอบ */
            height: auto !important;
            max-height: 350px !important;
            object-fit: contain !important;
            display: block !important;
            margin: 0 auto !important; /* จัดกึ่งกลาง */
        }
        
        /* ตั้งค่าเลย์เอาต์พิเศษเฉพาะตอนเซฟ PDF */
        body.exporting-pdf #modal-content {
            width: 800px !important; /* บังคับขนาดเป็น PC */
            max-width: none !important;
            margin: 0 auto !important; /* จัดกึ่งกลาง */
            padding: 20px !important;
        }
        
        body.exporting-pdf .hide-in-pdf {
            display: none !important; /* ซ่อนข้อความ "(คลิกเพื่อขยาย)" */
        }
        body.exporting-pdf * {
            box-shadow: none !important; /* ปิดเงาให้ดูเป็นกระดาษปรินท์ */
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        
        <!-- Header -->
        <div class="bg-blue-800 p-6 flex flex-col md:flex-row justify-between items-center text-white">
            <div>
                <h1 class="text-2xl font-bold">ข้อมูลประวัติการตรวจเช็ค Separator</h1>
                <p class="text-blue-200 text-sm mt-1">ระบบดึงข้อมูลอัตโนมัติจาก Google Sheets</p>
            </div>
            <div class="mt-4 md:mt-0 flex space-x-3">
                <button onclick="fetchData()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md font-semibold transition shadow flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    รีเฟรชข้อมูล
                </button>
                <a href="form.html" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-md font-semibold transition shadow flex items-center">
                    + เพิ่มรายการใหม่
                </a>
            </div>
        </div>

        <!-- Table Container -->
        <div class="p-6 overflow-x-auto min-h-[400px]">
            <table id="dataTable" class="display responsive nowrap w-full text-sm hidden" style="width:100%">
                <thead>
                    <tr>
                        <th>วันที่ตรวจเช็ค</th>
                        <th>CM Number</th>
                        <th>ผู้ตรวจเช็ค</th>
                        <th>ท่อเข้า Cyclone</th>
                        <th>ผนังกัน Rotor</th>
                        <th>เวลาบันทึก (Timestamp)</th>
                        <th>รายละเอียด</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal สำหรับดูรายละเอียดแบบเต็ม -->
    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto transform transition-all">
            
            <div class="sticky top-0 bg-gray-800 text-white px-6 py-4 flex justify-between items-center rounded-t-xl z-10">
                <h2 class="text-xl font-bold" id="modal-title">รายละเอียดการตรวจเช็ค</h2>
                <button onclick="closeModal()" class="text-gray-300 hover:text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 bg-white" id="modal-content">
                <!-- Content injected via JS -->
            </div>
            
            <div class="bg-gray-50 px-6 py-4 rounded-b-xl flex justify-end space-x-3 border-t">
                <button onclick="downloadPDF()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded shadow transition flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    โหลดเป็น PDF
                </button>
                <button onclick="closeModal()" class="px-6 py-2 bg-gray-600 hover:bg-gray-700 text-white font-semibold rounded shadow transition">ปิดหน้าต่าง</button>
            </div>
        </div>
    </div>

    <!-- Javascript -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGKkCzyqUbBun5bW_v38W1_8thC49CbitoPvIITLb4YcNBN37QcW06499woUGH3Q/exec";
        let allData = [];
        let dataTable;

        function getStatusBadge(status) {
            if(!status) return '<span class="text-gray-400">-</span>';
            const s = String(status).toLowerCase().trim();
            if(s === 'normal' || (s.includes('ปกติ') && !s.includes('ไม่'))) {
                return `<span class="px-3 py-1 inline-flex text-sm leading-5 font-bold rounded-md bg-green-100 text-green-800 border border-green-200">ปกติ</span>`;
            } else {
                return `<span class="px-3 py-1 inline-flex text-sm leading-5 font-bold rounded-md bg-red-100 text-red-800 border border-red-200">ไม่ปกติ</span>`;
            }
        }

        function getDirectDriveLink(url) {
            if (!url) return '';
            const match = url.match(/\/d\/(.*?)\//);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        async function fetchData() {
            Swal.fire({
                title: 'กำลังดึงข้อมูล...',
                html: 'รอสักครู่ ระบบกำลังเชื่อมต่อฐานข้อมูล<br><br><div class="swal-loader"></div>',
                showConfirmButton: false,
                allowOutsideClick: false,
                allowEscapeKey: false
            });
            
            document.getElementById('dataTable').classList.add('hidden');
            
            if ($.fn.DataTable.isDataTable('#dataTable')) {
                $('#dataTable').DataTable().destroy();
            }
            document.getElementById('tableBody').innerHTML = '';

            try {
                const response = await fetch(SCRIPT_URL);
                const json = await response.json();

                if (json.result === 'success') {
                    allData = json.data;
                    renderTable(allData);
                    Swal.close();
                    const Toast = Swal.mixin({
                        toast: true, position: 'top-end', showConfirmButton: false, timer: 1500
                    });
                    Toast.fire({ icon: 'success', title: 'โหลดข้อมูลสำเร็จ!' });
                } else {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + json.message, 'error');
                }
            } catch (error) {
                Swal.fire('เชื่อมต่อล้มเหลว', 'กรุณาตรวจสอบอินเทอร์เน็ต: ' + error.message, 'error');
                console.error(error);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            
            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                const date = row["วันที่ตรวจเช็ค"] ? row["วันที่ตรวจเช็ค"].split(' ')[0] : '-'; 
                const cm = row["CM_Number"] || '-';
                const checker = row["ชื่อผู้ตรวจเช็ค"] || '-';
                
                const getMiniBadge = (status) => {
                    const s = String(status||'').toLowerCase().trim();
                    if(s === 'normal' || (s.includes('ปกติ') && !s.includes('ไม่'))) return `<span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">ปกติ</span>`;
                    return `<span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">ไม่ปกติ</span>`;
                };

                const cyclone = getMiniBadge(row["ท่อเข้า_Cyclone"]);
                const rotor = getMiniBadge(row["ผนังกันRotor"]);
                const timestamp = row["Timestamp"] || '-';

                tr.innerHTML = `
                    <td class="font-medium text-gray-900">${date}</td>
                    <td class="font-bold text-blue-600">${cm}</td>
                    <td>${checker}</td>
                    <td>${cyclone}</td>
                    <td>${rotor}</td>
                    <td class="text-gray-500 text-xs">${timestamp}</td>
                    <td>
                        <button onclick="viewDetails(${index})" class="text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold py-1 px-3 border border-indigo-200 rounded shadow-sm transition flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            ดูข้อมูลทั้งหมด
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('dataTable').classList.remove('hidden');
            
            $('#dataTable').DataTable({
                responsive: true,
                language: {
                    search: "ค้นหาข้อมูล:",
                    lengthMenu: "แสดง _MENU_ รายการต่อหน้า",
                    info: "กำลังแสดง _START_ ถึง _END_ จากทั้งหมด _TOTAL_ รายการ",
                    infoEmpty: "ไม่พบข้อมูล",
                    zeroRecords: "ไม่พบข้อมูลที่ค้นหา",
                    paginate: { first: "หน้าแรก", last: "หน้าสุดท้าย", next: "ถัดไป", previous: "ก่อนหน้า" }
                },
                order: [[5, 'desc']] 
            });
        }

        // ==========================================
        // Modal & Details Logic (ออกแบบใหม่ เน้นการพิมพ์ PDF จัดกึ่งกลางสวยงาม)
        // ==========================================
        function viewDetails(index) {
            const row = allData[index];
            if(!row) return;

            document.getElementById('modal-title').innerText = `รายงานผลการตรวจเช็ค`;
            
            const html = `
                <!-- หัวกระดาษเอกสาร (แสดงเด่นชัดตอนปรินท์) -->
                <div class="mb-8 text-center border-b-2 border-blue-900 pb-4 avoid-page-break">
                    <h1 class="text-2xl font-extrabold text-blue-900 mb-4 uppercase">รายงานผลการตรวจเช็ค Separator</h1>
                    <div class="inline-flex justify-center gap-6 text-sm bg-blue-50 py-2 px-6 rounded-full border border-blue-200">
                        <span class="font-semibold text-gray-700">CM Number: <span class="text-blue-700 font-bold ml-1">${row["CM_Number"] || '-'}</span></span>
                        <span class="font-semibold text-gray-700">วันที่: <span class="text-blue-700 font-bold ml-1">${row["วันที่ตรวจเช็ค"] ? row["วันที่ตรวจเช็ค"].split(' ')[0] : '-'}</span></span>
                        <span class="font-semibold text-gray-700">ผู้ตรวจ: <span class="text-blue-700 font-bold ml-1">${row["ชื่อผู้ตรวจเช็ค"] || '-'}</span></span>
                    </div>
                </div>

                <!-- ================== ส่วนที่ 1 ================== -->
                <div class="mb-6 avoid-page-break">
                    <h2 class="text-lg font-bold text-white mb-4 bg-gray-800 py-2 px-4 rounded">1. ข้อมูลรูปภาพอ้างอิง และ ระยะช่องใบ</h2>
                    
                    <div class="mb-6 flex justify-center">
                        <img src="https://lh3.googleusercontent.com/d/1fB0YiYEVY87YhMGVOJegLrTP7JBcOjmN" class="pdf-img border border-gray-300 rounded" crossorigin="anonymous">
                    </div>

                    <div class="grid grid-cols-2 gap-4 max-w-4xl mx-auto">
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-center">
                            <span class="text-sm font-medium text-gray-800">1. ระยะช่องใบ 1,2 (55 mm)</span>
                            <div class="font-bold text-lg text-blue-700">${row["Gap_ใบที่1-2(55mm)"] || '-'} <span class="text-sm text-gray-500 font-normal">mm</span></div>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-center">
                            <span class="text-sm font-medium text-gray-800">2. ระยะช่องใบ 3,4 (66 mm)</span>
                            <div class="font-bold text-lg text-blue-700">${row["Gap_ใบที่3-4(66mm)"] || '-'} <span class="text-sm text-gray-500 font-normal">mm</span></div>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-center">
                            <span class="text-sm font-medium text-gray-800">3. ระยะช่องใบ 5,6 (77 mm)</span>
                            <div class="font-bold text-lg text-blue-700">${row["Gap_ใบที่5-6(77mm)"] || '-'} <span class="text-sm text-gray-500 font-normal">mm</span></div>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-center">
                            <span class="text-sm font-medium text-gray-800">4. ระยะช่องใบ 7,8 (88 mm)</span>
                            <div class="font-bold text-lg text-blue-700">${row["Gap_ใบที่7-8(88mm)"] || '-'} <span class="text-sm text-gray-500 font-normal">mm</span></div>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-center">
                            <span class="text-sm font-medium text-gray-800">5. ระยะช่องใบ 9,10 (99 mm)</span>
                            <div class="font-bold text-lg text-blue-700">${row["Gap_ใบที่9-10(99mm)"] || '-'} <span class="text-sm text-gray-500 font-normal">mm</span></div>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-center">
                            <span class="text-sm font-medium text-gray-800">6. ระยะช่องใบ 11,12 (110 mm)</span>
                            <div class="font-bold text-lg text-blue-700">${row["Gap_ใบที่11-12(110mm)"] || '-'} <span class="text-sm text-gray-500 font-normal">mm</span></div>
                        </div>
                    </div>
                </div>

                <!-- ================== ส่วนที่ 2 (ขึ้นหน้าใหม่) ================== -->
                <div class="page-break mb-6">
                    <h2 class="text-lg font-bold text-white mb-4 bg-gray-800 py-2 px-4 rounded">2. สถานะช่องใบ (Guide Vane)</h2>
                    <div class="mb-6 flex justify-center">
                        <img src="https://lh3.googleusercontent.com/d/1nIvh8xEG7UpZeUT65NIwntaYqYbxYR8w" class="pdf-img border border-gray-300 rounded" crossorigin="anonymous">
                    </div>
                    
                    <div class="bg-white border rounded-lg divide-y divide-gray-200 w-full max-w-4xl mx-auto">
                        <div class="p-3 flex flex-row items-center">
                            <div class="w-1/4 font-medium text-gray-800">ช่องใบที่ 1,2</div>
                            <div class="w-1/4 text-center">${getStatusBadge(row["GuideVane_1-2"])}</div>
                            <div class="w-2/4"><span class="text-sm text-gray-600 block pl-4 border-l"><strong>Remark:</strong> ${row["GuideVane_1-2_Remark"] || '-'}</span></div>
                        </div>
                        <div class="p-3 bg-gray-50 flex flex-row items-center">
                            <div class="w-1/4 font-medium text-gray-800">ช่องใบที่ 3,4</div>
                            <div class="w-1/4 text-center">${getStatusBadge(row["GuideVane_3-4"])}</div>
                            <div class="w-2/4"><span class="text-sm text-gray-600 block pl-4 border-l"><strong>Remark:</strong> ${row["GuideVane_3-4_Remark"] || '-'}</span></div>
                        </div>
                        <div class="p-3 flex flex-row items-center">
                            <div class="w-1/4 font-medium text-gray-800">ช่องใบที่ 5,6</div>
                            <div class="w-1/4 text-center">${getStatusBadge(row["GuideVane_5-6"])}</div>
                            <div class="w-2/4"><span class="text-sm text-gray-600 block pl-4 border-l"><strong>Remark:</strong> ${row["GuideVane_5-6_Remark"] || '-'}</span></div>
                        </div>
                        <div class="p-3 bg-gray-50 flex flex-row items-center">
                            <div class="w-1/4 font-medium text-gray-800">ช่องใบที่ 7,8</div>
                            <div class="w-1/4 text-center">${getStatusBadge(row["GuideVane_7-8"])}</div>
                            <div class="w-2/4"><span class="text-sm text-gray-600 block pl-4 border-l"><strong>Remark:</strong> ${row["GuideVane_7-8_Remark"] || '-'}</span></div>
                        </div>
                        <div class="p-3 flex flex-row items-center">
                            <div class="w-1/4 font-medium text-gray-800">ช่องใบที่ 9,10</div>
                            <div class="w-1/4 text-center">${getStatusBadge(row["GuideVane_9-10"])}</div>
                            <div class="w-2/4"><span class="text-sm text-gray-600 block pl-4 border-l"><strong>Remark:</strong> ${row["GuideVane_9-10_Remark"] || '-'}</span></div>
                        </div>
                        <div class="p-3 bg-gray-50 flex flex-row items-center">
                            <div class="w-1/4 font-medium text-gray-800">ช่องใบที่ 11,12</div>
                            <div class="w-1/4 text-center">${getStatusBadge(row["GuideVane_11-12"])}</div>
                            <div class="w-2/4"><span class="text-sm text-gray-600 block pl-4 border-l"><strong>Remark:</strong> ${row["GuideVane_11-12_Remark"] || '-'}</span></div>
                        </div>
                    </div>
                </div>

                <!-- ================== ส่วนที่ 3 (ขึ้นหน้าใหม่) ================== -->
                <div class="page-break mb-6">
                    <h2 class="text-lg font-bold text-white mb-4 bg-gray-800 py-2 px-4 rounded">3. ตรวจสอบ Cyclone & Chute</h2>
                    
                    <div class="avoid-page-break bg-white border border-gray-300 rounded-lg p-4 mb-4 flex flex-row gap-4 items-center">
                        <div class="w-1/3 flex justify-center"><img src="https://lh3.googleusercontent.com/d/1nMrtF1OJ5tXz-puE5h7ZuUL6OZAHxpO_" class="pdf-img border rounded" crossorigin="anonymous"></div>
                        <div class="w-2/3">

            document.getElementById('modal-content').innerHTML = html;

        function viewImageFull(src) {
            Swal.fire({
                imageUrl: src,
                imageAlt: 'ภาพแนบ',
                width: '90%',
                padding: '1em',
                showConfirmButton: false,
                showCloseButton: true,
                backdrop: `rgba(0,0,0,0.85)`
            });
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.body.classList.remove('modal-active');
        }

        $(document).ready(function() {
            fetchData();
        });
        
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });
        
        function downloadPDF() {
            const element = document.getElementById('modal-content');
            
            const cmElement = document.querySelector('#modal-content .text-blue-700.font-bold.uppercase');
            const cmName = cmElement ? cmElement.innerText : 'Unknown';
            const fileName = `Report_Separator_${cmName}.pdf`;

            const opt = {
                margin:       [0.4, 0.4, 0.4, 0.4], 
                filename:     fileName,
                image:        { type: 'jpeg', quality: 1.0 },
                pagebreak:    { mode: ['css', 'legacy'] },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true,
                    windowWidth: 1024 // บังคับสร้างเลย์เอาต์หน้าจอคอมฯ ป้องกันเลย์เอาต์เรียงแบบมือถือ
                }, 
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            Swal.fire({
                title: 'กำลังสร้างเอกสาร PDF',
                text: 'ระบบกำลังจัดหน้าให้สวยงาม กรุณารอสักครู่...',
                timer: 4500,
                timerProgressBar: true,
                didOpen: () => { Swal.showLoading() }
            });

            // ปิดเงา ลบปุ่ม และบังคับขนาดเพื่อให้หน้ากระดาษ PDF ออกมาเป็นทางการที่สุด
            document.body.classList.add('exporting-pdf');

            html2pdf().set(opt).from(element).save().then(() => {
                document.body.classList.remove('exporting-pdf');
                Swal.close();
            }).catch(() => {
                document.body.classList.remove('exporting-pdf');
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถสร้างไฟล์ PDF ได้', 'error');
            });
        }
    </script>
